models:
  vlm:
    provider: "qwen"
    name: "Qwen/Qwen3-VL-Instruct-4B"
    max_tokens: 1024
    temperature: 0.0
  retriever:
    name: "Alibaba-NLP/GVE-7B"
    index_path: "data/indexes/slidevqa"

agent:
  top_k: 1
  max_iters: 5
  partial_memory_capacity: 2

image_budget:
  yes_pixels: 400000
  partial_pixels: 200000

dataset:
  name: "slidevqa"
  split: "test"
  num_samples: 200

runtime:
  output_dir: "outputs/runs"
  device: "cuda"
  dtype: "bfloat16"
  attn_implementation: null
