models:
  vlm:
    provider: openai_compatible
    name: 7b-vidoseek-colqwen
    api_base_url: http://localhost:8000/v1
    api_key_env: OPENAI_API_KEY
    max_tokens: 1024
    temperature: 0.0
    prompt_mode: system_in_user
  retriever:
    name: /root/autodl-tmp/models/colqwen2.5-v0.1
    index_path: /root/autodl-tmp/vidoseek/index_colqwen
agent:
  top_k: 1
  max_iters: 15
  partial_memory_capacity: 2
image_budget:
  yes_pixels: 400000
  partial_pixels: 400000
dataset:
  name: slidevqa
  split: test
  num_samples: 1142
runtime:
  output_dir: /root/autodl-tmp/visual_rag_agent/outputs/7b_vidoseek_colqwen
  device: cuda
  dtype: bfloat16
  attn_implementation: flash_attention_2
